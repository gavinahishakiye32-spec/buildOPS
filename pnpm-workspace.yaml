# Single package. This file exists so pnpm 10 can record which dependency
# install scripts are allowed to run.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - unrs-resolver

ignoredBuiltDependencies:
  - "@scarf/scarf"

# Transitive dependency floors for the advisories that failed `pnpm audit --audit-level=high`.
overrides:
  proxy-addr: ^2.0.8
  handlebars: ^4.7.10
  undici: ^6.28.1
  multer: ^2.4.0
  fast-uri: ^3.1.8
  tmp: ^0.2.6
  "brace-expansion@>=2.0.0 <3.0.0": ^2.1.7
  "brace-expansion@>=4.0.0 <6.0.0": ^5.0.12
